---
- name: Set AWS provider IDs on Kubernetes worker nodes
  hosts: control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Get Kubernetes node information
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - json
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: k8s_nodes
      changed_when: false

    - name: Set provider ID on worker nodes
      ansible.builtin.shell: |
        NODE_NAME=$(
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}' \
          | awk '$2 == "{{ hostvars[item].private_ip }}" {print $1}'
        )

        if [ -z "$NODE_NAME" ]; then
          echo "Could not find Kubernetes node for private IP {{ hostvars[item].private_ip }}"
          exit 1
        fi

        kubectl patch node "$NODE_NAME" \
          --type=merge \
          --patch '{"spec":{"providerID":"aws:///{{ hostvars[item].availability_zone }}/{{ hostvars[item].instance_id }}"}}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop: "{{ groups['workers'] }}"
      register: provider_id_patch
      changed_when: "'patched' in provider_id_patch.stdout"

    - name: Verify AWS provider IDs
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - custom-columns=NAME:.metadata.name,PROVIDER-ID:.spec.providerID
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: provider_ids
      changed_when: false

    - name: Display provider IDs
      ansible.builtin.debug:
        var: provider_ids.stdout_lines


    - name: Show all nodes in k8s cluster
      ansible.builtin.shell: |
        kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
      register: k8s_nodes_status

    - name: Display Kubernetes nodes status
      ansible.builtin.debug:
        var: k8s_nodes_status.stdout_lines             