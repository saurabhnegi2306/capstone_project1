---
- name: Install Easypay application on control plane node
  hosts: control_plane
  become: true
  gather_facts: false

  vars_files:
    - group_vars/all.yml

  tasks:

    - name: Copy k8s manifests from local to control plane node
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /home/{{ ansible_user }}/kubernetes/.   

    - name: Show Easypay deployment pods and services
      ansible.builtin.shell: |
        kubectl get pods,svc -n easypay -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
      register: easypay_app_status

    - name: Display Easypay application status
      ansible.builtin.debug:
        var: easypay_app_status.stdout_lines        
