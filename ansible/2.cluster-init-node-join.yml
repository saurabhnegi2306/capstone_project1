---
- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all_lab.yml

  tasks:
    - name: Initialize cluster
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ private_ip }}
        --pod-network-cidr={{ pod_network_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Create MySQL data directory
      ansible.builtin.file:
        path: /data/mysql
        state: directory
        owner: "999"
        group: "999"
        mode: "0755"

    - name: Verify MySQL directory
      ansible.builtin.stat:
        path: /data/mysql
      register: mysql_dir
        
    - name: Install Calico operator
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/tigera-operator.yaml
      changed_when: true

    - name: Download Calico custom resources
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/custom-resources.yaml
        dest: /tmp/calico-custom-resources.yaml

    - name: Match Calico CIDR
      ansible.builtin.replace:
        path: /tmp/calico-custom-resources.yaml
        regexp: 'cidr: 192\\.168\\.0\\.0/16'
        replace: "cidr: {{ pod_network_cidr }}"

    - name: Apply Calico
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: kubectl apply -f /tmp/calico-custom-resources.yaml
      changed_when: true

    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Store join command
      ansible.builtin.set_fact:
        worker_join_command: "{{ join_command.stdout }}"

    - name: Print join command
      ansible.builtin.debug:
        var: worker_join_command 
        
- name: Join worker nodes
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Join cluster
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].worker_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf        