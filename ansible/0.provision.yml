---
- name: Provision AWS infrastructure for Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Get VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        vpc_ids:
          - "{{ vpc_id }}"
      register: vpc_info

    - name: Fail if VPC does not exist
      ansible.builtin.fail:
        msg: "VPC {{ vpc_id }} was not found in {{ aws_region }}"
      when: vpc_info.vpcs | length == 0

    - name: Create and attach Internet Gateway
      amazon.aws.ec2_vpc_igw:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        state: present
        tags:
          Name: "{{ cluster_name }}-igw"
          Project: "{{ cluster_name }}"
          ManagedBy: Ansible
      register: igw

    - name: Get available AZs
      amazon.aws.aws_az_info:
        region: "{{ aws_region }}"
        filters:
          state: available
      register: az_info

    - name: Show selected AZs
      ansible.builtin.debug:
        msg:
          - "Control plane AZ: {{ az_info.availability_zones[0].zone_name }}"
          - "Worker 1 AZ: {{ az_info.availability_zones[1].zone_name }}"
          - "Worker 2 AZ: {{ az_info.availability_zones[2].zone_name }}"

    - name: Validate at least three AZs are available
      ansible.builtin.assert:
        that:
          - az_info.availability_zones | length >= 3
        fail_msg: "At least 3 availability zones are required"

    - name: Create control-plane subnet in AZ 1
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ control_plane_subnet_cidr }}"
        az: "{{ az_info.availability_zones[0].zone_name }}"
        map_public: true
        state: present
        tags:
          Name: "{{ cluster_name }}-control-plane-subnet"
          Project: "{{ cluster_name }}"
          Role: control-plane
      register: control_plane_subnet

    - name: Create worker 1 subnet in AZ 2
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ worker_1_subnet_cidr }}"
        az: "{{ az_info.availability_zones[1].zone_name }}"
        map_public: true
        state: present
        tags: >-
          {{
            {
              'Name': cluster_name ~ '-worker-1-subnet',
              'Project': cluster_name,
              'Role': 'worker-1',
              'ManagedBy': 'Ansible',
              'kubernetes.io/role/elb': '1',
              ('kubernetes.io/cluster/' ~ cluster_name): 'shared'
            }
          }}
      register: worker_1_subnet

    - name: Create worker 2 subnet in AZ 3
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ worker_2_subnet_cidr }}"
        az: "{{ az_info.availability_zones[2].zone_name }}"
        map_public: true
        state: present
        tags: >-
          {{
            {
              'Name': cluster_name ~ '-worker-2-subnet',
              'Project': cluster_name,
              'Role': 'worker-2',
              'ManagedBy': 'Ansible',
              'kubernetes.io/role/elb': '1',
              ('kubernetes.io/cluster/' ~ cluster_name): 'shared'
            }
          }}         
      register: worker_2_subnet

    - name: Create public route table
      amazon.aws.ec2_vpc_route_table:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        subnets:
          - "{{ control_plane_subnet.subnet.id }}"
          - "{{ worker_1_subnet.subnet.id }}"
          - "{{ worker_2_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "{{ cluster_name }}-public-rt"
          Project: "{{ cluster_name }}"
          ManagedBy: Ansible

    - name: Create Kubernetes security group
      amazon.aws.ec2_security_group:
        name: "{{ cluster_name }}-sg"
        description: Security group for self-managed Kubernetes lab
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: 0.0.0.0/0
            rule_desc: SSH for lab
          - proto: tcp
            ports: [6443]
            cidr_ip: 0.0.0.0/0
            rule_desc: Kubernetes API for lab
          - proto: tcp
            from_port: 30000
            to_port: 32767
            cidr_ip: 0.0.0.0/0
            rule_desc: Kubernetes NodePort range
          - proto: tcp
            ports:
              - 30080
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow frontend NodePort for NLB
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        tags:
          Name: "{{ cluster_name }}-sg"
          Project: "{{ cluster_name }}"
          ManagedBy: Ansible
      register: cluster_sg

    - name: Add all internal traffic from same security group
      amazon.aws.ec2_security_group:
        name: "{{ cluster_name }}-sg"
        description: Security group for self-managed Kubernetes lab
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        purge_rules: false
        rules:
          - proto: -1
            group_id: "{{ cluster_sg.group_id }}"
            rule_desc: All traffic between Kubernetes nodes
      register: cluster_sg_internal

    - name: Ensure local SSH directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"

    - name: Generate local SSH key pair
      community.crypto.openssh_keypair:
        path: "{{ local_private_key_path }}"
        type: rsa
        size: 4096
        mode: "0600"
        state: present
      register: local_key

    - name: Import public key into AWS
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ aws_region }}"
        key_material: "{{ lookup('file', local_public_key_path) }}"
        state: present

    - name: Create AWS Load Balancer Controller IAM policy
      amazon.aws.iam_managed_policy:
        policy_name: "{{ nlb_controller_policy_name }}"
        policy: "{{ lookup('file', 'files/aws-load-balancer-controller-iam-policy.json') }}"
        state: present
      register: nlb_controller_policy

    - name: Attach Load Balancer Controller policy to node role
      amazon.aws.iam_role:
        name: "{{ nlb_controller_role_name }}"
        assume_role_policy_document:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - ec2.amazonaws.com
              Action:
                - sts:AssumeRole
        managed_policies:
          - "{{ nlb_controller_policy.policy.arn }}"
        state: present
      register: nlb_controller_role 

    - name: Create EC2 instance profile
      amazon.aws.iam_instance_profile:
        name: "{{ nlb_controller_instance_profile_name }}"
        role: "{{ nlb_controller_role_name }}"
        state: present  

    - name: Launch control-plane instance
      amazon.aws.ec2_instance:
        name: "{{ cluster_name }}-control-plane"
        region: "{{ aws_region }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ control_plane_subnet.subnet.id }}"
        security_group: "{{ cluster_sg.group_id }}"
        iam_instance_profile: "{{ nlb_controller_instance_profile_name }}"
        source_dest_check: false
        network:
          assign_public_ip: true
        exact_count: 1
        wait: true
        state: running
        tags:
          Project: "{{ cluster_name }}"
          Role: control-plane
          ManagedBy: Ansible
      register: control_plane

     

    - name: Launch worker 1 in AZ 2
      amazon.aws.ec2_instance:
        name: "{{ cluster_name }}-worker-1"
        region: "{{ aws_region }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ worker_1_subnet.subnet.id }}"
        security_group: "{{ cluster_sg.group_id }}"
        iam_instance_profile: "{{ nlb_controller_instance_profile_name }}"
        source_dest_check: false
        network:
          assign_public_ip: true
        exact_count: 1
        wait: true
        state: running
        tags:
          Project: "{{ cluster_name }}"
          Role: worker
          Worker: worker-1
          ManagedBy: Ansible
      register: worker_1
    - name: Launch worker 2 in AZ 3
      amazon.aws.ec2_instance:
        name: "{{ cluster_name }}-worker-2"
        region: "{{ aws_region }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ worker_2_subnet.subnet.id }}"
        security_group: "{{ cluster_sg.group_id }}"
        iam_instance_profile: "{{ nlb_controller_instance_profile_name }}"
        source_dest_check: false
        network:
          assign_public_ip: true
        exact_count: 1
        wait: true
        state: running
        tags:
          Project: "{{ cluster_name }}"
          Role: worker
          Worker: worker-2
          ManagedBy: Ansible
      register: worker_2      

    - name: Generate dynamic Ansible inventory
      ansible.builtin.copy:
        dest: inventory/hosts.ini
        mode: "0644"
        content: |
          [control_plane]
          control-plane ansible_host={{ control_plane.instances[0].public_ip_address }} private_ip={{ control_plane.instances[0].private_ip_address }} instance_id={{ control_plane.instances[0].instance_id }} availability_zone={{ control_plane.instances[0].placement.availability_zone }}

          [workers]
          worker-1 ansible_host={{ worker_1.instances[0].public_ip_address }} private_ip={{ worker_1.instances[0].private_ip_address }} instance_id={{ worker_1.instances[0].instance_id }} availability_zone={{ worker_1.instances[0].placement.availability_zone }}
          worker-2 ansible_host={{ worker_2.instances[0].public_ip_address }} private_ip={{ worker_2.instances[0].private_ip_address }} instance_id={{ worker_2.instances[0].instance_id }} availability_zone={{ worker_2.instances[0].placement.availability_zone }}

          [k8s_cluster:children]
          control_plane
          workers

          [k8s_cluster:vars]
          ansible_user={{ ssh_user }}
          ansible_ssh_private_key_file={{ local_private_key_path }}
          ansible_python_interpreter=/usr/bin/python3

    - name: Wait for SSH on all instances
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: 22
        delay: 10
        timeout: 300
      loop:
        - "{{ control_plane.instances[0].public_ip_address }}"
        - "{{ worker_1.instances[0].public_ip_address }}"
        - "{{ worker_2.instances[0].public_ip_address }}"

    - name: Display infrastructure details
      ansible.builtin.debug:
        msg:
          - "Security Group: {{ cluster_sg.group_id }}"
          - "Private key: {{ local_private_key_path }}"
          - "Control plane: {{ control_plane.instances[0].public_ip_address }}"
          - "Worker 1: {{  worker_1.instances[0].public_ip_address }}"
          - "Worker 2: {{  worker_2.instances[0].public_ip_address }}"
