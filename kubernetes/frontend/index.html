<!DOCTYPE html>

<html>

<head>

<title>EasyPay Portal</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<h2>EasyPay Customer Portal</h2>

<input
id="name"
placeholder="Customer Name">

<input
id="email"
placeholder="Email">

<input
id="balance"
placeholder="Wallet Balance">

<button onclick="addCustomer()">

Add Customer

</button>

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Balance</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="customers">

</tbody>

</table>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
